schema {
  query: Query
  mutation: Mutation
}

interface ICodedException {
  errorCode: AppErrorCode!
  message: String!
}

"The node interface is implemented by entities that have a global unique identifier."
interface Node {
  id: ID!
}

type AccumulatedStat implements Node {
  id: ID!
  matchupRosterSpotId: ID!
  statId: ID!
  statValue: Decimal!
  pointsScored: Decimal!
  stat: Stat! @cost(weight: "10")
}

type AddDemoESPNLeaguePayload {
  league: League
  errors: [AddDemoESPNLeagueError!]
}

type AddESPNLeagueToUserPayload {
  league: League
  errors: [AddESPNLeagueToUserError!]
}

type ESPNAuthenticationError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNHttpError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNInvalidYearError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNLeagueInvalidError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNNoActiveYearsError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type FantasyMember implements Node {
  id: ID!
  fantasyProviderId: ID!
  providerMemberId: String!
  displayName: String!
  firstName: String!
  lastName: String!
  fantasyProvider: FantasyProvider! @cost(weight: "10")
}

type FantasyProvider implements Node {
  id: ID!
  name: String!
  value: FantasyProviderId!
}

type League implements Node {
  id: ID!
  userId: UUID
  fantasyProviderId: ID!
  providerLeagueId: String!
  sportId: SportId!
  seasons: [LeagueSeason!]! @cost(weight: "10")
  fantasyProvider: FantasyProvider! @cost(weight: "10")
}

type LeagueSeason implements Node {
  id: ID!
  leagueId: ID!
  year: Int!
  settings: LeagueSeasonSettings! @cost(weight: "10")
  members: [LeagueSeasonMember!]! @cost(weight: "10")
}

type LeagueSeasonMember implements Node {
  leagueSeasonId: ID!
  memberId: ID!
  isLeagueCreator: Boolean!
  isLeagueManager: Boolean!
  member: FantasyMember! @cost(weight: "10")
  teams: [LeagueSeasonMemberTeam!]! @cost(weight: "10")
  id: ID!
}

type LeagueSeasonMemberId {
  leagueSeasonId: Int!
  memberId: Int!
}

type LeagueSeasonMemberTeam implements Node {
  memberId: ID!
  leagueSeasonId: ID!
  teamId: ID!
  team: Team! @cost(weight: "10")
  id: ID!
}

type LeagueSeasonMemberTeamId {
  leagueSeasonId: Int!
  memberId: Int!
  teamId: Int!
}

type LeagueSeasonScheduleSettings implements Node {
  id: ID!
  leagueSeasonId: ID!
  matchupCount: Int!
  matchupLength: Int!
  playoffMatchupLength: Int!
  playoffTeamCount: Int!
  variablePlayoffMatchupLength: Boolean!
}

type LeagueSeasonScoringItem implements Node {
  id: ID!
  leagueSeasonId: ID!
  statId: ID!
  points: Decimal!
  stat: Stat! @cost(weight: "10")
}

type LeagueSeasonScoringSettings implements Node {
  id: ID!
  leagueSeasonId: ID!
  homeTeamBonusPoints: Int!
  matchupTieRule: String!
  matchupTieRuleBy: Int!
  playerRankType: String!
  playoffHomeTeamBonusPoints: Int!
  playoffMatchupTieRule: String!
  playoffMatchupTieRuleBy: Int!
  scoringType: String!
  scoringItems: [LeagueSeasonScoringItem!]! @cost(weight: "10")
}

type LeagueSeasonSettings implements Node {
  id: ID!
  leagueSeasonId: ID!
  leagueName: String!
  scheduleSettings: LeagueSeasonScheduleSettings! @cost(weight: "10")
  scoringSettings: LeagueSeasonScoringSettings! @cost(weight: "10")
}

type MatchupOutcome implements Node {
  id: ID!
  name: String!
  value: MatchupOutcomeId!
}

type MatchupRosterSpot implements Node {
  id: ID!
  matchupId: ID!
  playerId: ID!
  positionId: ID!
  pointsScored: Decimal!
  player: Player! @cost(weight: "10")
  position: Position! @cost(weight: "10")
  accumulatedStats: [AccumulatedStat!]! @cost(weight: "10")
}

type MatchupType implements Node {
  id: ID!
  name: String!
  value: MatchupTypeId!
}

type Mutation {
  addESPNLeagueToUser(input: AddESPNLeagueToUserInput!): AddESPNLeagueToUserPayload! @authorize @cost(weight: "10")
  addDemoESPNLeague(input: AddDemoESPNLeagueInput!): AddDemoESPNLeaguePayload! @authorize(roles: [ "admin" ]) @cost(weight: "10")
}

type Player implements Node {
  id: ID!
  providerId: ID!
  providerPlayerId: Int!
  firstName: String!
  lastName: String!
  fullName: String!
  provider: FantasyProvider! @cost(weight: "10")
}

type Position implements Node {
  id: ID!
  name: String!
  value: PositionId!
}

type Query {
  "Fetches an object given its ID."
  node("ID of the object." id: ID!): Node @cost(weight: "10")
  "Lookup nodes by a list of IDs."
  nodes("The list of node IDs." ids: [ID!]!): [Node]! @cost(weight: "10")
  demoLeagues: [League!]! @cost(weight: "10")
  league(id: ID!): League! @cost(weight: "10")
}

type Stat implements Node {
  id: ID!
  name: String!
  value: StatId!
}

type Team implements Node {
  id: ID!
  providerTeamId: Int!
  abbreviation: String!
  logoURL: String
  name: String!
  seasonStats: TeamSeasonStats! @cost(weight: "10")
  matchups: [TeamMatchup!]! @cost(weight: "10")
}

type TeamMatchup implements Node {
  id: ID!
  teamId: ID!
  opponentTeamId: ID
  week: Int!
  score: Decimal!
  matchupOutcomeId: ID!
  matchupTypeId: ID!
  opponent: Team @cost(weight: "10")
  matchupOutcome: MatchupOutcome! @cost(weight: "10")
  matchupType: MatchupType! @cost(weight: "10")
  matchupRosterSpots: [MatchupRosterSpot!]! @cost(weight: "10")
}

type TeamSeasonStats implements Node {
  id: ID!
  teamId: ID!
  wins: Int!
  losses: Int!
  ties: Int!
  winPercentage: Decimal!
  pointsAgainst: Decimal!
  pointsFor: Decimal!
}

union AddDemoESPNLeagueError = ESPNAuthenticationError | ESPNHttpError | ESPNLeagueInvalidError | ESPNNoActiveYearsError | ESPNInvalidYearError

union AddESPNLeagueToUserError = ESPNAuthenticationError | ESPNHttpError | ESPNLeagueInvalidError | ESPNNoActiveYearsError | ESPNInvalidYearError

input AddDemoESPNLeagueInput {
  leagueId: String!
  swid: String!
  espnS2Id: String!
}

input AddESPNLeagueToUserInput {
  leagueId: String!
  swid: String!
  espnS2Id: String!
}

enum AppErrorCode {
  ESPN_AUTHENTICATION_FAILED
  ESPN_INVALID_YEAR
  ESPN_LEAGUE_INVALID
  ESPN_NO_ACTIVE_YEARS
  ESPN_GENERAL_HTTP_ERROR
}

"Defines when a policy shall be executed."
enum ApplyPolicy {
  "Before the resolver was executed."
  BEFORE_RESOLVER
  "After the resolver was executed."
  AFTER_RESOLVER
  "The policy is applied in the validation step before the execution."
  VALIDATION
}

enum FantasyProviderId {
  ESPN
}

