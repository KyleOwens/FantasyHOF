}

type TeamSeasonStats implements Node {
  id: ID!
  teamId: ID!
  wins: Int!
  losses: Int!
  ties: Int!
  winPercentage: Decimal!
  pointsAgainst: Decimal!
  pointsFor: Decimal!
}

type User implements Node {
  id: ID!
  clerkId: String!
