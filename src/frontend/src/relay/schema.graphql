}

type AddESPNLeagueToUserPayload {
  addLeagueMutationPayload: AddLeagueMutationPayload
  errors: [AddESPNLeagueToUserError!]
}

type AddLeagueMutationPayload {
  jobId: String!
  import: LeagueImport!
}

type DeleteUserLeagueMutationPayload {
  leagueId: ID!
}

type DeleteUserLeaguePayload {
  deleteUserLeagueMutationPayload: DeleteUserLeagueMutationPayload
  errors: [DeleteUserLeagueError!]
}

type ESPNAuthenticationError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNHttpError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNInvalidYearError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNLeagueInvalidError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNNoActiveYearsError implements ICodedException {
  message: String!
