schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

interface ICodedException {
  errorCode: AppErrorCode!
  message: String!
}

"The node interface is implemented by entities that have a global unique identifier."
interface Node {
  id: ID!
}

interface Record {
  type: RecordTypeId!
  member: FantasyMember!
  metric: RecordMetric!
  displayName: String!
  category: RecordCategoryId!
  sentiment: RecordSentiment!
  metricId: RecordMetricId!
  metricType: RecordMetricType!
  iconURI: String!
  sortDirection: SortDirection!
}

interface RecordDetails {
  rank: Int!
  metric: RecordMetric!
  memberDetails: LeagueMember!
  key: String!
}

interface RecordMetric {
  value: Decimal!
  metricId: RecordMetricId!
  unit: String!
}

type AccumulatedStat implements Node {
  id: ID!
  matchupRosterSpotId: ID!
  statId: ID!
  statValue: Decimal!
  pointsScored: Decimal!
  stat: Stat! @cost(weight: "10")
}

type AddESPNLeagueToUserPayload {
  addLeagueMutationPayload: AddLeagueMutationPayload
  errors: [AddESPNLeagueToUserError!]
}

type AddLeagueMutationPayload {
  jobId: String!
  import: LeagueImport!
}

type ESPNAuthenticationError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNHttpError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNInvalidYearError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNLeagueInvalidError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type ESPNNoActiveYearsError implements ICodedException {
  message: String!
  errorCode: AppErrorCode!
}

type FantasyMember implements Node {
  id: ID!
  fantasyProviderId: ID!
  providerMemberId: String!
  displayName: String!
  firstName: String!
  lastName: String!
  fantasyProvider: FantasyProvider! @cost(weight: "10")
  fullName: String!
}

type FantasyProvider implements Node {
  id: ID!
  name: String!
  logoURL: String!
  value: FantasyProviderId!
}

type League implements Node {
  id: ID!
  userId: UUID!
  fantasyProviderId: ID!
  providerLeagueId: String!
  sportId: SportId!
  currentLeagueName: String!
  currentLeagueYear: Int!
  seasons: [LeagueSeason!]! @cost(weight: "10")
  members: [LeagueMember!]!
  fantasyProvider: FantasyProvider! @cost(weight: "10")
  sport: Sport! @cost(weight: "10")
  createdAt: DateTime!
  updatedAt: DateTime!
  recordSummary: LeagueRecordSummary @cost(weight: "10")
  recordDetails(recordType: RecordTypeId!): [RecordDetails!]! @cost(weight: "10")
}

type LeagueImport implements Node {
  id: ID!
  userId: UUID!
  providerId: FantasyProviderId!
  providerleagueId: String!
  statusId: LeagueImportStatusId!
  progress: Int!
  error: String
  leagueId: Int
  user: User! @cost(weight: "10")
  provider: FantasyProvider! @cost(weight: "10")
  status: LeagueImportStatus! @cost(weight: "10")
  league: League @cost(weight: "10")
}

type LeagueImportStatus implements Node {
  id: ID!
  name: String!
  value: LeagueImportStatusId!
}

type LeagueMember {
  leagueId: Int!
  memberId: Int!
  firstyear: Int!
  learYear: Int!
  tenure: Int!
  league: League!
  member: FantasyMember!
}

type LeagueRecord implements Record {
  type: RecordTypeId!
  member: FantasyMember!
  metric: RecordMetric!
  displayName: String!
  category: RecordCategoryId!
  sentiment: RecordSentiment!
  metricId: RecordMetricId!
  metricType: RecordMetricType!
  iconURI: String!
  sortDirection: SortDirection!
}

type LeagueRecordDetails implements RecordDetails {
  key: String!
  rank: Int!
  metric: RecordMetric!
  memberDetails: LeagueMember!
}

type LeagueRecordSummary {
  leagueRecords: [LeagueRecord!]!
  seasonalRecords: [SeasonalRecord!]!
  weeklyRecords: [WeeklyRecord!]!
  playerRecords: [PlayerRecord!]!
}

type LeagueSeason implements Node {
  id: ID!
  leagueId: ID!
  year: Int!
  settings: LeagueSeasonSettings! @cost(weight: "10")
  members: [LeagueSeasonMember!]! @cost(weight: "10")
}

type LeagueSeasonMember implements Node {
  leagueSeasonId: ID!
  memberId: ID!
  isLeagueCreator: Boolean!
  isLeagueManager: Boolean!
  member: FantasyMember! @cost(weight: "10")
  teams: [LeagueSeasonMemberTeam!]! @cost(weight: "10")
  id: ID!
}

type LeagueSeasonMemberId {
  leagueSeasonId: Int!
  memberId: Int!
}

type LeagueSeasonMemberTeam implements Node {
  leagueSeasonId: ID!
  memberId: ID!
  teamId: ID!
  owner: LeagueSeasonMember!
  team: Team! @cost(weight: "10")
  id: ID!
}

type LeagueSeasonMemberTeamId {
  leagueSeasonId: Int!
  memberId: Int!
  teamId: Int!
}

type LeagueSeasonScheduleSettings implements Node {
  id: ID!
  leagueSeasonId: ID!
  matchupCount: Int!
  matchupLength: Int!
  playoffMatchupLength: Int!
  playoffTeamCount: Int!
  variablePlayoffMatchupLength: Boolean!
}

type LeagueSeasonScoringItem implements Node {
  id: ID!
  leagueSeasonId: ID!
  statId: ID!
  points: Decimal!
  stat: Stat! @cost(weight: "10")
}

type LeagueSeasonScoringSettings implements Node {
  id: ID!
  leagueSeasonId: ID!
  homeTeamBonusPoints: Int!
  matchupTieRule: String!
  matchupTieRuleBy: Int!
  playerRankType: String!
  playoffHomeTeamBonusPoints: Int!
  playoffMatchupTieRule: String!
  playoffMatchupTieRuleBy: Int!
  scoringType: String!
  scoringItems: [LeagueSeasonScoringItem!]! @cost(weight: "10")
}

type LeagueSeasonSettings implements Node {
  id: ID!
  leagueSeasonId: ID!
  leagueName: String!
  scheduleSettings: LeagueSeasonScheduleSettings! @cost(weight: "10")
  scoringSettings: LeagueSeasonScoringSettings! @cost(weight: "10")
}

type MatchupOutcome implements Node {
  id: ID!
  name: String!
  value: MatchupOutcomeId!
}

type MatchupRosterSpot implements Node {
  id: ID!
  matchupTeamDetailsId: ID!
  playerId: ID!
  positionId: ID!
  pointsScored: Decimal!
  player: Player! @cost(weight: "10")
  position: Position! @cost(weight: "10")
  accumulatedStats: [AccumulatedStat!]! @cost(weight: "10")
}

type MatchupTeamDetails implements Node {
  id: ID!
  teamId: ID!
  score: Decimal!
  matchupOutcomeId: ID!
  team: Team! @cost(weight: "10")
  outcome: MatchupOutcome! @cost(weight: "10")
  matchupRosterSpots: [MatchupRosterSpot!]! @cost(weight: "10")
}

type MatchupType implements Node {
  id: ID!
  name: String!
  value: MatchupTypeId!
}

type Mutation {
  addESPNLeagueToUser(input: AddESPNLeagueToUserInput!): AddESPNLeagueToUserPayload! @authorize @cost(weight: "10")
  publishTestMessage(input: PublishTestMessageInput!): PublishTestMessagePayload! @authorize @cost(weight: "10")
}

type Player implements Node {
  id: ID!
  providerId: ID!
  providerPlayerId: Int!
  firstName: String!
  lastName: String!
  fullName: String!
  provider: FantasyProvider! @cost(weight: "10")
}

type PlayerRecord implements Record {
  player: Player!
  week: Int!
  year: Int!
  type: RecordTypeId!
  member: FantasyMember!
  metric: RecordMetric!
  displayName: String!
  category: RecordCategoryId!
  sentiment: RecordSentiment!
  metricId: RecordMetricId!
  metricType: RecordMetricType!
  iconURI: String!
  sortDirection: SortDirection!
}

type PlayerRecordDetails implements RecordDetails {
  year: Int!
  week: Int!
  player: Player!
  key: String!
  rank: Int!
  metric: RecordMetric!
  memberDetails: LeagueMember!
}

type Position implements Node {
  id: ID!
  name: String!
  value: PositionId!
}

type PublishTestMessagePayload {
  boolean: Boolean
}

type Query {
  "Fetches an object given its ID."
  node("ID of the object." id: ID!): Node @cost(weight: "10")
  "Lookup nodes by a list of IDs."
  nodes("The list of node IDs." ids: [ID!]!): [Node]! @cost(weight: "10")
  me: User! @authorize @cost(weight: "10")
  demoLeagues: [League!]! @cost(weight: "10")
  league(id: ID!): League! @cost(weight: "10")
  fantasyProviders: [FantasyProvider!]! @cost(weight: "10")
  recordMetadata: [RecordMetadata!]! @cost(weight: "10")
}

type RatioRecordMetric implements RecordMetric {
  numerator: Decimal!
  numeratorMetricId: RecordMetricId!
  denominator: Decimal!
  denominatorMetricId: RecordMetricId!
  numeratorUnit: String!
  denominatorUnit: String!
  value: Decimal!
  metricId: RecordMetricId!
  unit: String!
}

type RecordMetadata {
  type: RecordTypeId!
  displayName: String!
  category: RecordCategoryId!
  categoryDisplayName: String!
  sentiment: RecordSentiment!
  metricId: RecordMetricId!
  metricType: RecordMetricType!
  iconURI: String!
  sortDirection: SortDirection!
}

type ScalarRecordMetric implements RecordMetric {
  value: Decimal!
  metricId: RecordMetricId!
  unit: String!
}

type SeasonalRecord implements Record {
  year: Int!
  type: RecordTypeId!
  member: FantasyMember!
  metric: RecordMetric!
  displayName: String!
  category: RecordCategoryId!
  sentiment: RecordSentiment!
  metricId: RecordMetricId!
  metricType: RecordMetricType!
  iconURI: String!
  sortDirection: SortDirection!
}

type SeasonalRecordDetails implements RecordDetails {
  year: Int!
  key: String!
  rank: Int!
  metric: RecordMetric!
  memberDetails: LeagueMember!
}

type Sport implements Node {
  id: ID!
  name: String!
  value: SportId!
}

type Stat implements Node {
  id: ID!
  name: String!
  value: StatId!
}

type Subscription {
  leagueImportProgress: LeagueImport! @authorize
}

type Team implements Node {
  id: ID!
  leagueSeasonId: Int!
  providerTeamId: Int!
  seasonRank: Int!
  abbreviation: String!
  logoURL: String
  name: String!
  season: LeagueSeason!
  memberTeams: [LeagueSeasonMemberTeam!]!
  seasonStats: TeamSeasonStats! @cost(weight: "10")
  matchups: [TeamMatchup!]! @cost(weight: "10")
}

type TeamMatchup implements Node {
  id: ID!
  teamId: ID!
  ownerMatchupDetailsId: ID
  opponentMatchupDetailsId: ID
  year: Int!
  week: Int!
  matchupTypeId: ID!
  team: Team!
  matchupType: MatchupType! @cost(weight: "10")
  ownerMatchupDetails: MatchupTeamDetails! @cost(weight: "10")
  opponentMatchupDetails: MatchupTeamDetails @cost(weight: "10")
