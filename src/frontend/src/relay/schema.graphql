type Query {
  "Fetches an object given its ID."
  node("ID of the object." id: ID!): Node @cost(weight: "10")
  "Lookup nodes by a list of IDs."
  nodes("The list of node IDs." ids: [ID!]!): [Node]! @cost(weight: "10")
  me: User! @authorize @cost(weight: "10")
  demoLeagues: [League!]! @cost(weight: "10")
  fantasyProviders: [FantasyProvider!]! @cost(weight: "10")
  recordMetadata: [RecordMetadata!]! @cost(weight: "10")
}

